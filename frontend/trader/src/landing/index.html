<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PM mark on a black disc, transparent outside the circle. The favicon
         used to be the landscape wordmark (2000x350), which a 16/32px tab icon
         crushes to an unreadable smear; the dark disc keeps the mark legible on
         light and dark tab bars. ?v= busts the browser's favicon cache. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proline Markets — Future of Trading</title>
    <meta name="description" content="Proline Markets — your gateway to Forex, Indices, CFDs, Commodities and Crypto. Trusted by traders worldwide since 2019." />
    <!-- The landing is a dark-first design: :root defines the dark palette
         (cream text on ink), and the hero, nav and ticker all sit on dark
         imagery. Forcing "light" flipped --foreground to ink, so the hero
         headline (text-foreground) rendered dark-on-dark and vanished. -->
    <script>
      document.documentElement.setAttribute("data-theme", "dark");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
